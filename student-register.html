<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Register | KTU Election</title>
  <style>
    :root {
      --navy: #102a43;
      --blue: #1d4ed8;
      --green: #0f766e;
      --gold: #d97706;
      --bg: #eef4ff;
      --card: rgba(255,255,255,0.95);
      --text: #1f2937;
      --muted: #5f6c7b;
      --shadow: 0 24px 50px rgba(15, 23, 42, 0.2);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px;
      font-family: Arial,sans-serif;
      background: #ffffff;
      color: var(--text);
    }
    .auth-shell {
      width: min(980px,100%);
      max-width: 980px;
      min-height: 620px;
      display: grid;
      grid-template-columns: 1.05fr 1.4fr;
      background: rgba(255,255,255,0.96);
      border-radius: 28px;
      overflow: hidden;
      box-shadow: var(--shadow);
      border: 1px solid rgba(255,255,255,0.2);
      animation: panelIn 0.7s ease;
      margin: 0 auto;
    }
    .auth-brand {
      position: relative;
      background: linear-gradient(170deg, rgba(15,23,42,0.95), rgba(29,78,216,0.9));
      color: white;
      padding: 42px 28px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 18px;
    }
    .auth-brand::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,0.06));
    }
    .auth-brand > * { position: relative; z-index: 1; }
    .auth-brand img {
      width: 92px; height: 92px; object-fit: contain; border-radius: 18px; background: rgba(255,255,255,0.12); padding: 10px;
    }
    .eyebrow { letter-spacing: 0.12em; text-transform: uppercase; font-size: 0.72rem; font-weight: 800; color: rgba(255,255,255,0.8); }
    .auth-brand h1 { margin: 0; color: #facc15; font-size: clamp(2rem, 3vw, 2.8rem); }
    .auth-brand p { margin: 0; color: rgba(255,255,255,0.8); font-size: 1.02rem; }
    .auth-panel {
      padding: 36px 30px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      background: rgba(255,255,255,0.96);
      align-items: stretch;
    }
    .top-row {
      display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 18px;
    }
    .top-row a { text-decoration: none; color: #1d4ed8; font-weight: 700; }
    .auth-panel h2 { margin: 0 0 10px; font-size: 2rem; color: var(--navy); }
    .form-grid { display: grid; gap: 16px; width: 100%; }
    label { display: block; margin-bottom: 8px; font-weight: 700; }
    input, select {
      width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid #dbe3ef; font-size: 1rem; background: #fff; transition: all 0.2s ease;
    }
    input:focus, select:focus { outline: none; border-color: #60a5fa; box-shadow: 0 0 0 4px rgba(96,165,250,0.16); }
    .btn {
      border: none; border-radius: 12px; padding: 12px 18px; font-weight: 700; cursor: pointer; transition: transform 0.2s ease, box-shadow 0.2s ease; display: inline-flex; align-items: center; justify-content: center; width: 100%; text-decoration: none;
    }
    .btn:hover { transform: translateY(-1px); }
    .btn.primary { background: linear-gradient(135deg, #2563eb, #1d4ed8); color: white; }
    .btn.success { background: linear-gradient(135deg, #0f766e, #0f9f8c); color: white; }
    .switcher {
      margin-top: 18px; display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 0.95rem; color: #475569;
    }
    .switcher a { color: #1d4ed8; font-weight: 700; }
    .notice {
      background: linear-gradient(180deg, #ecfeff, #eff6ff); border: 1px solid #a5f3fc; color: #0f172a; border-radius: 12px; padding: 15px 16px; margin-top: 16px; font-weight: 600;
    }
    .hidden { display: none !important; }
    @keyframes panelIn { from { opacity: 0; transform: translateY(18px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @media (max-width: 760px) { .auth-shell { grid-template-columns: 1fr; } .auth-brand { min-height: 220px; } }
  </style>
</head>
<body>
  <div class="auth-shell">
    <div class="auth-brand">
      <img src="assets/branding/ktu-logo.svg" alt="KTU Logo" />
      <div class="eyebrow">Koforidua Technical University</div>
      <h1>Student Register</h1>
      <p>Create your student account and prepare to vote securely.</p>
    </div>

    <div class="auth-panel">
      <div class="top-row">
        <span class="eyebrow">Student Portal</span>
        <a href="index.html">← Home</a>
      </div>
      <h2>Create Account</h2>
      <form id="studentRegisterForm" class="form-grid">
        <div>
          <label for="registerStudentFirstName">First name</label>
          <input id="registerStudentFirstName" type="text" placeholder="Student first name" required />
        </div>
        <div>
          <label for="registerStudentLastName">Last name</label>
          <input id="registerStudentLastName" type="text" placeholder="Student last name" required />
        </div>
        <div>
          <label for="registerStudentEmail">Personal email</label>
          <input id="registerStudentEmail" type="email" placeholder="student@gmail.com" required />
        </div>
        <button class="btn success" type="submit">Create Student Account</button>
      </form>

      <div class="switcher">
        <span>Already have an account?</span>
        <a href="student-login.html">Login here</a>
      </div>
      <div id="studentMessage" class="notice hidden"></div>
    </div>
  </div>

  <script src="main.js"></script>
</body>
</html>
