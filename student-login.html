<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Login | KTU Election</title>
  <link rel="stylesheet" href="main.css" />
  <link rel="stylesheet" href="auth.css" />
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px;
      background: #ffffff;
    }
    .auth-shell {
      width: min(980px, 100%);
      max-width: 980px;
      min-height: 560px;
      display: grid;
      grid-template-columns: 1.08fr 1.42fr;
      background: rgba(255,255,255,0.96);
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 30px 60px rgba(15,23,42,0.24);
      border: 1px solid rgba(255,255,255,0.2);
      animation: panelIn 0.7s ease;
      margin: 0 auto;
    }
    .auth-brand {
      background: linear-gradient(160deg, rgba(15,23,42,0.95), rgba(29,78,216,0.9));
      color: white;
      padding: 42px 28px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 18px;
      position: relative;
    }
    .auth-brand::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,0.08));
    }
    .auth-brand > * {
      position: relative;
      z-index: 1;
    }
    .auth-brand img {
      width: 92px; height: 92px; object-fit: contain; border-radius: 18px; background: rgba(255,255,255,0.12); padding: 10px;
    }
    .auth-brand h1 { margin: 0; color: #facc15; font-size: clamp(2rem, 3vw, 2.8rem); }
    .auth-brand p { margin: 0; color: rgba(255,255,255,0.8); font-size: 1.02rem; }
    .auth-panel {
      padding: 36px 30px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      background: rgba(255,255,255,0.96);
      align-items: stretch;
    }
    .top-row {
      display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 18px;
    }
    .eyebrow { letter-spacing: 0.12em; text-transform: uppercase; font-size: 0.72rem; color: #64748b; font-weight: 800; }
    .top-row a { color: #1d4ed8; font-weight: 700; text-decoration: none; }
    .auth-panel h2 { margin: 0 0 10px; font-size: 2rem; color: #102a43; }
    .auth-panel form { display: grid; gap: 16px; width: 100%; }
    .auth-panel input, .auth-panel select {
      width: 100%; border: 1px solid #dbe3ef; border-radius: 12px; padding: 12px 14px; font-size: 1rem; background: #fff;
      transition: all 0.2s ease;
    }
    .auth-panel input:focus, .auth-panel select:focus { border-color: #60a5fa; box-shadow: 0 0 0 4px rgba(96,165,250,0.16); outline: none; }
    .btn { width: 100%; }
    .switcher {
      margin-top: 18px; display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 0.95rem; color: #475569;
    }
    .switcher a { color: #1d4ed8; font-weight: 700; }
    @keyframes panelIn { from { opacity: 0; transform: translateY(20px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @media (max-width: 760px) {
      .auth-shell { grid-template-columns: 1fr; }
      .auth-brand { min-height: 220px; }
    }
  </style>
</head>
<body>
  <div class="auth-shell">
    <div class="auth-brand">
      <img src="assets/branding/ktu-logo.svg" alt="KTU Logo" />
      <div class="eyebrow">Koforidua Technical University</div>
      <h1>Student Voting</h1>
      <p>Secure sign in for eligible students and voting access.</p>
    </div>

    <div class="auth-panel">
      <div class="top-row">
        <span class="eyebrow">Student Portal</span>
        <a href="index.html">← Home</a>
      </div>
      <h2>Login</h2>
      <form id="studentLoginForm" class="form-grid">
        <div>
          <label for="studentFirstName">First name</label>
          <input id="studentFirstName" type="text" placeholder="Enter your first name" required />
        </div>
        <div>
          <label for="studentLastName">Last name</label>
          <input id="studentLastName" type="text" placeholder="Enter your last name" required />
        </div>
        <div>
          <label for="studentEmail">Personal email</label>
          <input id="studentEmail" type="email" placeholder="yourname@gmail.com" required />
        </div>
        <button class="btn primary" type="submit">Login & Vote</button>
      </form>

      <div class="switcher">
        <span>Don’t have an account?</span>
        <a href="student-register.html">Create one here</a>
      </div>
      <div id="studentMessage" class="notice hidden"></div>
    </div>
  </div>

  <script src="main.js"></script>
</body>
</html>
